# ============================================================
# TAPE FEEDER SERVOS on the Arduino Uno ([mcu uno])
# Include from printer.cfg, right under [include pnp_hmi.cfg]:
#     [include pnp_feeders.cfg]
#
# Slot k = servo k, counted left to right from the front; slot 1 is the feeder against the datum.
# Wiring: servo signal -> Uno pin below. Servo +5 V / GND -> SEPARATE 5 V supply.
#         Supply GND -> an Uno GND pin (common ground). Never power servos from the Uno's 5 V pin.
# Never use D0/D1 (USB link to the Pi), D10 (frame lights, uno:PB2) or D11 (up-light ring, uno:PB3).
#
#   Slot  Arduino  Klipper
#    1     D5      uno:PD5
#    2     D6      uno:PD6
#    3     D3      uno:PD3   (not tested on a servo yet)
#
# Pulse widths come from the servo tested on the old Nano feeder sketch
# (650 us = 0 deg, 2350 us = 180 deg). If a servo buzzes or hits its own stop at 0 or 180,
# narrow them (e.g. 0.0007 / 0.0023).
# ============================================================

[servo feeder_1]
pin: uno:PD5                    # Arduino D5
maximum_servo_angle: 180
minimum_pulse_width: 0.00065
maximum_pulse_width: 0.00235
# no initial_angle: the servo stays limp until first commanded (no jump at power-up)

[servo feeder_2]
pin: uno:PD6                    # Arduino D6
maximum_servo_angle: 180
minimum_pulse_width: 0.00065
maximum_pulse_width: 0.00235

# Slot 3: D3. If a slot's section is commented out, FEEDER_TOGGLE gives a clear error for it.
[servo feeder_3]
pin: uno:PD3                    # Arduino D3
maximum_servo_angle: 180
minimum_pulse_width: 0.00065
maximum_pulse_width: 0.00235


# ------------------------------------------------------------
# FEEDER_TOGGLE SLOT=n [COUNT=k] : one feed cycle 0 -> 90 -> 0 (rest -> stroke -> rest),
# repeated COUNT times (default 1), then the servo goes limp so it doesn't buzz at rest.
# Angles are per slot (slot 1 first) and timings are shared: tune them here.
# ------------------------------------------------------------
[gcode_macro FEEDER_TOGGLE]
description: Feed one part: 0 -> 90 -> 0. FEEDER_TOGGLE SLOT=1|2|3 [COUNT=1]
variable_rest_angles:   [0, 0, 0]
# Angle -> pulse: 650 + angle x 9.44 us (650-2350 us over 0-180 deg): 90 = 1500 us, 105 = 1642 us.
# Slot 2: 105 (2026-11-17, was 90): its tape wasn't pulled far enough.
variable_stroke_angles: [90, 105, 90]
variable_out_ms: 400            # time for the servo to reach the stroke angle
variable_back_ms: 400           # time to come back and settle
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    {% if slot < 1 or slot > 3 %}
        { action_raise_error("FEEDER_TOGGLE: SLOT must be 1, 2 or 3 (got %s)" % params.SLOT|default('nothing')) }
    {% elif ('servo feeder_%d' % slot) not in printer %}
        { action_raise_error("FEEDER_TOGGLE: feeder %d has no [servo feeder_%d] section yet (pin TBD)" % (slot, slot)) }
    {% else %}
        {% for _ in range(params.COUNT|default(1)|int) %}
            SET_SERVO SERVO=feeder_{slot} ANGLE={stroke_angles[slot - 1]}
            G4 P{out_ms}
            SET_SERVO SERVO=feeder_{slot} ANGLE={rest_angles[slot - 1]}
            G4 P{back_ms}
        {% endfor %}
        SET_SERVO SERVO=feeder_{slot} WIDTH=0      # stop pulses: no buzzing/heating at rest
    {% endif %}


# ------------------------------------------------------------
# FEEDER_SET SLOT=n ANGLE=deg : hold one feeder's servo at an angle (setup / wiring tests).
# FEEDER_SET SLOT=n OFF=1     : servo goes limp.
# ------------------------------------------------------------
[gcode_macro FEEDER_SET]
description: Hold a feeder servo at an angle. FEEDER_SET SLOT=n ANGLE=0-180 | FEEDER_SET SLOT=n OFF=1
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    {% if ('servo feeder_%d' % slot) not in printer %}
        { action_raise_error("FEEDER_SET: no [servo feeder_%s] section (SLOT=%s)" % (slot, params.SLOT|default('nothing'))) }
    {% elif params.OFF|default(0)|int %}
        SET_SERVO SERVO=feeder_{slot} WIDTH=0
    {% else %}
        SET_SERVO SERVO=feeder_{slot} ANGLE={params.ANGLE|default(0)|float}
    {% endif %}