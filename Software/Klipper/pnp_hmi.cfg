# ============================================================
# pnpvision on the touchscreen / Mainsail (no laptop).
# Install: copy this file next to printer.cfg (~/printer_data/config/), add the line
#   [include pnp_hmi.cfg]
# to printer.cfg, restart Klipper. Needs the gcode_shell_command extension (already installed
# for VISION_HOME).
#
# Run a job:  RUN_JOB JOB=<job name with spaces as _>   e.g. RUN_JOB JOB=Test_PCB-top
#   ALIGN=1       align the board first (down camera must be on alignment pad A)
#   NO_FEEDERS=1  no feeder Nano: you put a part in each pocket when asked
#   ONLY=R1,C3    only these parts (comma-separated refs, no spaces)
#   DRY_RUN=1     no parts: the down camera visits each placement and saves a photo
#   SHOW_PICK=1   (debug, NO_FEEDERS) park the down camera over the pick spot before each prompt
# or pick one of the PNP_*.gcode launcher files in the print list (pnpvision make-launchers).
# run-job asks its questions as dialogs; the buttons run PNP_ANSWER. PNP_STOP ends the job
# cleanly before the next part. The emergency stop still works as usual (it kills the job too).
# Don't jog or run other macros while a job runs: the job moves the machine itself.
# Output: ~/OSHE-PnP/Software/pnpvision/results/run_job_macro.log
# ============================================================
[gcode_shell_command run_job]
command: bash /home/pnp/OSHE-PnP/Software/pnpvision/scripts/run_job.sh
timeout: 10.
verbose: False

[gcode_macro RUN_JOB]
description: Run a pnpvision job (JOB=name, ALIGN=1, NO_FEEDERS=1)
gcode:
    {% set job = params.JOB|default("") %}
    {% if job == "" %}
        RESPOND TYPE=error MSG="RUN_JOB needs JOB=<name>, e.g. RUN_JOB JOB=Test_PCB-top"
    {% else %}
        {% set flags = "" %}
        {% if params.ALIGN|default(0)|int %}
            {% set flags = flags ~ " --align" %}
        {% endif %}
        {% if params.NO_FEEDERS|default(0)|int %}
            {% set flags = flags ~ " --no-feeders" %}
        {% endif %}
        {% if params.DRY_RUN|default(0)|int %}
            {% set flags = flags ~ " --dry-run" %}
        {% endif %}
        {% if params.SHOW_PICK|default(0)|int %}
            {% set flags = flags ~ " --show-pick" %}
        {% endif %}
        {% if params.ONLY|default("") != "" %}
            {% set flags = flags ~ " --only " ~ params.ONLY|replace(",", " ") %}
        {% endif %}
        RUN_SHELL_COMMAND CMD=run_job PARAMS="{job}{flags}"
        RESPOND MSG="RUN_JOB {job} started; follow the messages and dialogs"
    {% endif %}

[gcode_macro PNP_ANSWER]
description: Answer the open pnpvision dialog (VALUE=1 continue/yes, VALUE=0 stop/no)
variable_value: 1
variable_seq: 0
variable_stop: 0
gcode:
    SET_GCODE_VARIABLE MACRO=PNP_ANSWER VARIABLE=value VALUE={params.VALUE|default(1)|int}
    SET_GCODE_VARIABLE MACRO=PNP_ANSWER VARIABLE=seq VALUE={printer["gcode_macro PNP_ANSWER"].seq + 1}

[gcode_macro PNP_CONTINUE]
description: Continue the pnpvision job (same as the dialog's Continue button)
gcode:
    PNP_ANSWER VALUE=1

[gcode_macro PNP_STOP]
description: Stop the pnpvision job cleanly before the next part
gcode:
    SET_GCODE_VARIABLE MACRO=PNP_ANSWER VARIABLE=stop VALUE=1
    PNP_ANSWER VALUE=0
    RESPOND MSG="PNP_STOP: the job stops before the next part"

# ------------------------------------------------------------
# Buttons for other pnpvision commands (touchscreen menu: KlipperScreen_pnp.conf). Each runs in the
# background; its output appears in the console. They refuse to start while a job is running.
# ------------------------------------------------------------
[gcode_shell_command pnp_cmd]
command: bash /home/pnp/OSHE-PnP/Software/pnpvision/scripts/pnp_cmd.sh
timeout: 10.
verbose: False

[gcode_macro PNP_CHECK_MACHINE]
description: Recovery check (nozzle EMPTY, after VISION_HOME). APPLY=1 saves a moved nozzle centre
gcode:
    {% set extra = " --apply" if params.APPLY|default(0)|int else "" %}
    UP_LIGHT_ON
    RUN_SHELL_COMMAND CMD=pnp_cmd PARAMS="check-machine --yes{extra}"

[gcode_macro PNP_BIN_GOTO]
description: Nozzle over the reject bin (taught or default) at safe Z
gcode:
    RUN_SHELL_COMMAND CMD=pnp_cmd PARAMS="teach-bin --goto"

[gcode_macro PNP_BIN_TEACH]
description: Save the nozzle's current XY as the reject bin (jog it over the opening first)
gcode:
    RUN_SHELL_COMMAND CMD=pnp_cmd PARAMS="teach-bin"

[gcode_macro PNP_BIN_DEFAULT]
description: Forget a taught reject bin, go back to the plate-layout default
gcode:
    RUN_SHELL_COMMAND CMD=pnp_cmd PARAMS="teach-bin --default"

[gcode_macro PNP_SCREEN_TEST]
description: Show a test dialog (nothing moves): checks that dialogs work on this screen
gcode:
    RUN_SHELL_COMMAND CMD=pnp_cmd PARAMS="hmi-test"

[gcode_macro PNP_LAUNCHERS]
description: (Re)write the PNP_<job> launcher files in the print list. NO_FEEDERS=1 until the feeders work
gcode:
    {% set extra = " --no-feeders" if params.NO_FEEDERS|default(0)|int else "" %}
    RUN_SHELL_COMMAND CMD=pnp_cmd PARAMS="make-launchers{extra}"
