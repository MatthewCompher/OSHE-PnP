###############################
# LED Definitions
###############################

# Toolhead Lights
[neopixel leds]
pin: PB10
chain_count: 3          # number of LEDs on your strip
color_order: GRB         # most WS2812B strips; try RGB if colors come out swapped
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

# Up-camera light ring: 6 x WS2812, data on the Arduino Uno R3 (second Klipper MCU, [mcu uno])
# pin D11 = uno:PB3. Do not put LED data on the Octopus endstop (STOP) ports: they did not
# pass it (2026-11-09).
[neopixel up_light]
pin: uno:PB3
chain_count: 6
color_order: GRB          # try RGB if white looks coloured
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# Frame Lights
[neopixel frame]
pin: uno:PB2
chain_count: 44
color_order: GRB          # try RGB if white looks coloured
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

###############################
# LED Macros
###############################

#[gcode_macro UP_LIGHT_ON]
#description: Up-camera ring light on (white). UP_LIGHT_ON [LEVEL=0..1]
#gcode:
#    {% set L = params.LEVEL|default(1.0)|float %}
#    SET_LED LED=up_light RED={L} GREEN={L} BLUE={L}

#[gcode_macro UP_LIGHT_OFF]
#description: Up-camera ring light off
#gcode:
#    SET_LED LED=up_light RED=0 GREEN=0 BLUE=0

[gcode_macro LEDS_IDLE]
gcode:
    SET_LED_EFFECT EFFECT=idle REPLACE=1

[gcode_macro LEDS_BUSY]
gcode:
    SET_LED_EFFECT EFFECT=busy REPLACE=1

[gcode_macro LEDS_ERROR]
gcode:
    SET_LED_EFFECT EFFECT=error REPLACE=1

[gcode_macro LEDS_RAINBOW]
gcode:
    SET_LED_EFFECT EFFECT=rainbow REPLACE=1

[gcode_macro LEDS_OFF]
description: Turns off LED 1 only; vision lights stay on
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:leds (1)"

[gcode_macro VISION_LIGHT_ON]
description: Down camera light on
gcode:
    SET_LED_EFFECT EFFECT=vision_light REPLACE=1
    SET_GCODE_VARIABLE MACRO=VISION_LIGHT_TOGGLE VARIABLE=on VALUE=1

[gcode_macro VISION_LIGHT_OFF]
description: Down camera light off
gcode:
    SET_LED_EFFECT EFFECT=vision_light STOP=1
    # After the effect stops, the LEDs fall back to their base colour, which is the
    # neopixel's initial white, so set LEDs 2-3 to black explicitly.
    SET_LED LED=leds INDEX=2 RED=0 GREEN=0 BLUE=0 TRANSMIT=0
    SET_LED LED=leds INDEX=3 RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    SET_GCODE_VARIABLE MACRO=VISION_LIGHT_TOGGLE VARIABLE=on VALUE=0

[gcode_macro VISION_LIGHT_TOGGLE]
description: Toggle the down camera light
variable_on: 1
gcode:
    {% if printer["gcode_macro VISION_LIGHT_TOGGLE"].on|int == 1 %}
        VISION_LIGHT_OFF
    {% else %}
        VISION_LIGHT_ON
    {% endif %}

[gcode_macro UP_LIGHT_ON]
gcode:
    SET_LED_EFFECT EFFECT=cam_on REPLACE=1

[gcode_macro UP_LIGHT_RAINBOW]
gcode:
    SET_LED_EFFECT EFFECT=cam_rainbow REPLACE=1 FADETIME=1.0

[gcode_macro UP_LIGHT_OFF]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:up_light"

[gcode_macro FRAME_ON]
gcode:
    SET_LED_EFFECT EFFECT=frame_on REPLACE=1 FADETIME=1.0

[gcode_macro FRAME_OFF]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:frame"

[gcode_macro FRAME_RAINBOW]
gcode:
    SET_LED_EFFECT EFFECT=frame_rainbow REPLACE=1 FADETIME=1.0

[delayed_gcode startup]
initial_duration: 10.0
gcode:
    SET_LED_EFFECT EFFECT=vision_light REPLACE=1 FADETIME=1.0
    SET_LED_EFFECT EFFECT=idle REPLACE=1 FADETIME=1.0
    SET_LED_EFFECT EFFECT=frame_on REPLACE=1 FADETIME=1.0
    STOP_LED_EFFECTS LEDS="neopixel:up_light" FADETIME=1.0

###############################
# LED Effects
###############################

# LEDs 2-3: solid white for vision, always on
[led_effect vision_light]
frame_rate: 24
leds:
    neopixel:leds (2-3)
layers:
    static 0 0 top (1.0, 1.0, 1.0)

# LED 1: soft white breathing when idle (starts automatically)
[led_effect idle]
frame_rate: 24
leds:
    neopixel:leds (1)
layers:
    breathing 4 1 top (0.6, 0.6, 0.6)

# LED 1: blue pulse while working
[led_effect busy]
frame_rate: 24
leds:
    neopixel:leds (1)
layers:
    breathing 1 1 top (0.0, 0.3, 1.0)

# LED 1: red blink for errors
[led_effect error]
frame_rate: 24
leds:
    neopixel:leds (1)
layers:
    blink 1 0.5 top (1.0, 0.0, 0.0)

# LED 1: color cycle, for fun / testing
[led_effect rainbow]
autostart: true
frame_rate: 24
leds:
    neopixel:leds
layers:
    gradient 0.3 1 top (0.5, 0.0, 0.0),(0.0, 0.5, 0.0),(0.0, 0.0, 0.5)

[led_effect frame_rainbow]
autostart: true
frame_rate: 15
leds:
    neopixel:frame
layers:
    gradient 0.3 1 top (0.5, 0.0, 0.0),(0.0, 0.5, 0.0),(0.0, 0.0, 0.5)

[led_effect cam_rainbow]
autostart: true
frame_rate: 15
leds:
    neopixel:up_light
layers:
    gradient 0.3 1 top (0.5, 0.0, 0.0),(0.0, 0.5, 0.0),(0.0, 0.0, 0.5)

# Frame lights stay on during runs, but dim: at 0.5 they may wash out the up camera's view of
# the nozzle bore (2026-11-17 calibration check failed with them on). Tune the 0.15 here; test a
# level live first: STOP_LED_EFFECTS LEDS="neopixel:frame" then SET_LED LED=frame RED=.. GREEN=.. BLUE=..
[led_effect frame_on]
frame_rate: 24
leds:
    neopixel:frame
layers:
    static 1 1 top (0.15, 0.15, 0.15)

[led_effect cam_on]
frame_rate: 24
leds:
    neopixel:up_light
layers:
    static 1 1 top (1.0, 1.0, 1.0)
    

    