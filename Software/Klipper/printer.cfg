# ============================================================
# PICK AND PLACE MACHINE - KLIPPER CONFIG
# Ender 3 Mechanics + Octopus Pro + TMC5160T Drivers
# Raspberry Pi 4 Host
# ============================================================

###############################
#Printer CFG
###############################

[include mainsail.cfg]
[include LEDS.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_280028000751313339373836-if00

# Arduino Uno R3 (ATmega328P): extra I/O as a second Klipper MCU (up light, frame lights, feeder servos).
# Firmware: cd ~/klipper && make KCONFIG_CONFIG=config.uno (optional features trimmed to fit).
[mcu uno]
serial: /dev/serial/by-id/usb-Arduino__www.arduino.cc__0043_5573032383135130C112-if00
restart_method: arduino

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 7500
square_corner_velocity: 5.0
# Z capped well below X/Y: a crash or a typo'd jog can't slam the nozzle down. pnpvision's
# fastest Z move is 40 mm/s (config.toml [run]). Raise only if measured CPH needs it.
max_z_velocity: 50
max_z_accel: 1000
minimum_cruise_ratio: 0

# Needed, not a debug leftover: visual homing (VISION_HOME / pnpvision home) finds the homing dot
# with the down camera and then re-zeros X/Y with SET_KINEMATIC_POSITION, which Klipper only allows
# with enable_force_move. Nothing else uses it (no FORCE_MOVE in the macros or pnpvision); jogging
# an unhomed machine stays blocked as usual.
[force_move]
enable_force_move: True

[include moonraker_obico_macros.cfg]
[include pnp_hmi.cfg]
[include pnp_feeders.cfg]

[fan]
pin: PA8
max_power: 1.0

[board_pins]
aliases:
    # EXP1 header pins for BTT Octopus Pro
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15


###############################
#Steppers
###############################

#Stepper X
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: -5
position_endstop: 0
position_max: 235
homing_speed: 40          # 20 false-tripped with driver_SGT 2 (2026-11-08); retune SGT before lowering
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag1_pin: ^!PG6
run_current: 1.000
#stealthchop_threshold: 50
# You will need to tune this number later
driver_SGT: 2

#Stepper Y
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: -5
position_endstop: 0
position_max: 343
homing_speed: 40          # 20 false-tripped with driver_SGT 2 (2026-11-08); retune SGT before lowering
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag1_pin: ^!PG9
run_current: 1.000
#stealthchop_threshold: 50
# You will need to tune this number later
#started as 1
driver_SGT: 2

#Stepper Z
[stepper_z]
step_pin: PF11
dir_pin: !PG3         # Changed to Driver 2 Dir
enable_pin: !PG5     # Changed to Driver 2 Enable
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_z:virtual_endstop
position_endstop: 0
# Larger Z = nozzle lower. N08 tip touches the staging plate at Z ~50, so 51 stops any move
# (jog, macro, typo) driving the nozzle into the plate; picks/places are Z ~38-49.
# A tip shorter than N08 touches everything at a larger Z: raise this by the length difference.
position_max: 51
homing_speed: 20
homing_retract_dist: 5

[tmc5160 stepper_z]
cs_pin: PC6          # Changed to Driver 2 CS
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag1_pin: ^!PG10
# 0.5 A (was 0.8): Z needs little force, so a crash pushes ~40% less. Homing still uses 0.8
# (homing_override). If Z ever clicks/skips on fast moves, try 0.6.
run_current: 0.500
#stealthchop_threshold: 50
# You will need to tune this number later
driver_SGT: 3

# TOOLHEAD ROTATION (C-Axis) - LumenPnP NEMA 11, Driver 4
[manual_stepper stepper_r]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 360       # 1 unit = 1 degree
full_steps_per_rotation: 200 # 1.8 degree motor
# 2026-11-18: 360 deg/s, 3000 deg/s^2 (was 180 / 1000): a typical 90 deg part turn takes ~0.37 s
# instead of ~0.68 s. If the turn ever loses steps (placed angle off by a multiple of ~1.8 deg),
# go back to 180 / 1000.
velocity: 360                # degrees/second
accel: 3000                  # degrees/second^2

[tmc5160 manual_stepper stepper_r]
cs_pin: PC7
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 0.500
stealthchop_threshold: 0

[output_pin valve]
# FAN1 Header
pin: PD12
value: 0
shutdown_value: 0

[gcode_macro VALVE_ON]
description: Opens the solenoid valve
gcode:
    SET_PIN PIN=valve VALUE=1

[gcode_macro VALVE_OFF]
description: Closes the solenoid valve
gcode:
    SET_PIN PIN=valve VALUE=0

[gcode_macro TOGGLE_VALVE]
description: Toggles the solenoid valve state
gcode:
    {% if printer['output_pin valve'].value == 0 %}
        VALVE_ON
    {% else %}
        VALVE_OFF
    {% endif %}


###############################
#Macros
###############################


[homing_override]
axes: xyz
gcode:
    # Plain G28 homes everything; G28 X / Y / Z / R homes only those
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params and 'R' not in params %}
    {% set home_xy = home_all or 'X' in params or 'Y' in params %}
    {% set z_homed = 'z' in printer.toolhead.homed_axes %}

    G90   # absolute moves

    # 1. Home Z, then move to clearance height (Z5 = nozzle near the TOP; larger Z = lower)
    # Z homes at 0.8 A, the current driver_SGT 3 was tuned at; it runs at a lower run_current
    # (less force in a crash). This Klipper has no homing_current option, hence SET_TMC_CURRENT.
    # X/Y homing sweeps the head to the front-left corner, over the feeders at the front: the
    # nozzle must be at the top first. 2026-11-14: VISION_HOME ran G28 X Y with the nozzle at the
    # Z30 travel height, hit the feeders, and the stall was taken as the endstop. So: if Z isn't
    # homed, X/Y homing homes Z first; if it is, the nozzle goes up to Z5 first.
    {% if home_all or 'Z' in params or (home_xy and not z_homed) %}
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.8
        G4 P200
        G28 Z
        G1 Z5 F1200    # 5 mm at 20 mm/s
        M400
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={printer.configfile.settings['tmc5160 stepper_z'].run_current}
        G4 P2000
    {% elif home_xy %}
        G1 Z5 F1200    # Z already homed: raise the nozzle to the top before X/Y homing
        M400
    {% endif %}

    # Sensorless X/Y homing at reduced motor current: a gentler bump into the frame.
    # (CoreXY: both motors move for either axis, so lower both.) run_current is 1.0.
    # Lower current makes stall detection MORE sensitive: if homing ever stops early,
    # in mid-air, raise HOME_CURRENT back toward 1.0 or raise driver_SGT by 1.
    {% set HOME_CURRENT = 1.0 %}   # 0.8 false-tripped with driver_SGT 2 (2026-11-08)
    {% if home_all or 'X' in params or 'Y' in params %}
        # plain X/Y homing lands up to ~2 mm off: VISION_HOME is needed again (pnp_hmi.cfg)
        SET_GCODE_VARIABLE MACRO=_PNP_STATE VARIABLE=vision_homed VALUE=0
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
        G4 P500
    {% endif %}

    # 2. Home Y
    {% if home_all or 'Y' in params %}
        G28 Y
        G1 Y10 F1200
        G4 P2000
    {% endif %}

    # 3. Home X
    {% if home_all or 'X' in params %}
        G28 X
        G1 X10 F1200
        G4 P2000
    {% endif %}

    {% if home_all or 'X' in params or 'Y' in params %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc5160 stepper_x'].run_current}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc5160 stepper_y'].run_current}
    {% endif %}

    # 4. Rotation: lock the motor and call this angle zero
    {% if home_all or 'R' in params %}
        MANUAL_STEPPER STEPPER=stepper_r ENABLE=1
        MANUAL_STEPPER STEPPER=stepper_r SET_POSITION=0
    {% endif %}


[gcode_macro TEST_BED_MOVEMENT]
description: Full-bed linear and diagonal movement test with adjustable loops
gcode:
    {% set loops = params.LOOPS|default(1)|int %}

    G90

    {% for i in range(loops) %}


        ; Four corners
        G0 X10 Y10 Z5F60000
        G0 X230 Y10
        G0 X230 Y330
        G0 X10 Y330
        G0 X10 Y10

        ; Diagonal 1
        G0 X230 Y328
        G0 X10 Y10

        ; Diagonal 2
        G0 X230 Y10
        G0 X10 Y328

        ; Up/Down
        G0 Z5
        G0 Z60
        G0 Z5
        G0 Z60
        G0 Z5
        G0 Z60
        
    {% endfor %}

    ; Return to center
    G0 X117.5 Y166.5


[gcode_macro PNP_DEMO]
description: Simulated pick-and-place demo, mostly slow with fast bursts
gcode:
    {% set loops = params.LOOPS|default(50)|int %}
    {% set cfg = printer.configfile.settings.printer %}
    {% set picks = [(20, 90), (20, 150), (20, 210), (20, 270)] %}
    {% set xs = [90, 135, 180, 225] %}
    {% set ys = [80, 140, 200, 260, 320] %}

    G90
    G0 Z5 F3000

    {% for i in range(loops) %}
        {% set fast = (i % 10) >= 8 %}
        {% set pick = picks[i % 4] %}
        {% set px = xs[i % 4] %}
        {% set py = ys[(i // 4) % 5] %}

        {% if fast %}
            SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel}
        {% else %}
            SET_VELOCITY_LIMIT VELOCITY=250 ACCEL=1000
        {% endif %}

        ; Pick
        G0 X{pick[0]} Y{pick[1]} F60000
        G0 Z60
        G4 P{60 if fast else 250}
        G0 Z5

        ; Place
        G0 X{px} Y{py}
        G0 Z60
        G4 P{60 if fast else 250}
        G0 Z5
    {% endfor %}

    ; Restore limits and return to center
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel}
    G0 X117.5 Y166.5

# ============================================================
# VISION HOME (pnpvision): home X/Y, then re-zero X/Y on datum dot 0 with the down camera.
# Needs the gcode_shell_command Klipper extension (KIAUH: Advanced > Extensions) BEFORE
# these sections are added, or Klipper will not start.
# The script runs pnpvision in the background (a blocking call would deadlock, because
# pnpvision sends its moves back through Moonraker); the result shows in the console.
# VISION_HOME NO_G28=1 only re-references on the dot, without homing.
# ============================================================
[gcode_shell_command vision_home]
command: bash /home/pnp/OSHE-PnP/Software/pnpvision/scripts/vision_home.sh
timeout: 10.
verbose: False

[gcode_macro VISION_HOME]
description: Home X/Y, then re-zero X/Y on datum dot 0 with the down camera (pnpvision)
gcode:
    {% if params.NO_G28|default(0)|int %}
        RUN_SHELL_COMMAND CMD=vision_home PARAMS="--no-g28"
    {% else %}
        RUN_SHELL_COMMAND CMD=vision_home
    {% endif %}
    RESPOND MSG="VISION_HOME started; wait for its result line before moving the machine"
