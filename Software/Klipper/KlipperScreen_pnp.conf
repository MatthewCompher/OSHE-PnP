# ============================================================
# "Pick & Place" menu for KlipperScreen (the machine's touchscreen).
# Install: put this in ~/printer_data/config/KlipperScreen.conf ABOVE the line
#   #~# --- Do not edit below this line. This section is auto generated --- #~#
# link the job page (klipperscreen/pnp_job.py) into ~/KlipperScreen/panels/, then
# restart KlipperScreen (sudo systemctl restart KlipperScreen).
# The buttons run macros from pnp_hmi.cfg and printer.cfg. Messages from pnpvision appear in the
# console (and as pop-ups for errors); job questions open as dialogs.
# Layout:
#   Pick & Place
#     Job (start a job, watch it, Continue / Stop / Emergency stop) | EMERGENCY STOP |
#     Vision home | Calibration check
#     Lights > | Reject bin >
# Other PnP macros (PNP_STOP, PNP_CONTINUE, PNP_SCREEN_TEST, PNP_LAUNCHERS, _PNP_STATE) still work
# from the console / Mainsail.
# ============================================================

[menu __main pnp]
name: Pick & Place
icon: custom-script

[menu __main pnp job]
name: Job
icon: print
panel: pnp_job

# Software emergency stop (Klipper M112): every motor and output off at once, no confirm. Also on
# the Job page while a job runs, and in Mainsail. Afterwards: FIRMWARE_RESTART, then Vision home.
[menu __main pnp estop]
name: EMERGENCY STOP
icon: emergency
method: printer.emergency_stop

[menu __main pnp vision_home]
name: Vision home
icon: home
method: printer.gcode.script
params: {"script":"VISION_HOME"}

[menu __main pnp check]
name: Calibration check
icon: info
method: printer.gcode.script
params: {"script":"PNP_CHECK_MACHINE"}
confirm: Nozzle must be EMPTY and VISION_HOME done. The nozzle goes down over the up camera. Run the check?

[menu __main pnp lights]
name: Lights
icon: custom-script

[menu __main pnp lights up_on]
name: Up light on
icon: custom-script
method: printer.gcode.script
params: {"script":"UP_LIGHT_ON"}

[menu __main pnp lights up_off]
name: Up light off
icon: custom-script
method: printer.gcode.script
params: {"script":"UP_LIGHT_OFF"}

[menu __main pnp lights down_on]
name: Down light on
icon: custom-script
method: printer.gcode.script
params: {"script":"VISION_LIGHT_ON"}

[menu __main pnp lights down_off]
name: Down light off
icon: custom-script
method: printer.gcode.script
params: {"script":"VISION_LIGHT_OFF"}

[menu __main pnp bin]
name: Reject bin
icon: custom-script

[menu __main pnp bin goto]
name: Go to bin
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_BIN_GOTO"}

[menu __main pnp bin teach]
name: Teach bin here
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_BIN_TEACH"}
confirm: Save the nozzle's current position as the reject bin?

[menu __main pnp bin default]
name: Default bin
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_BIN_DEFAULT"}
confirm: Forget the taught bin and use the plate-layout default?
