# ============================================================
# "Pick & Place" menu for KlipperScreen (the machine's touchscreen).
# Install: paste everything below into ~/printer_data/config/KlipperScreen.conf ABOVE the line
#   #~# --- Do not edit below this line. This section is auto generated --- #~#
# then restart KlipperScreen (sudo systemctl restart KlipperScreen).
# The buttons run macros from pnp_hmi.cfg and printer.cfg. Messages from pnpvision appear in the
# console (and as pop-ups for errors); job questions open as dialogs.
# Layout:
#   Pick & Place
#     Vision home | Check machine | Lights > | Reject bin > | Jobs (print list) | Continue | Stop job
#     Screen test | Update launchers
# ============================================================

[menu __main pnp]
name: Pick & Place
icon: custom-script

[menu __main pnp vision_home]
name: Vision home
icon: home
method: printer.gcode.script
params: {"script":"VISION_HOME"}

[menu __main pnp check]
name: Check machine
icon: info
method: printer.gcode.script
params: {"script":"PNP_CHECK_MACHINE"}
confirm: Nozzle must be EMPTY and VISION_HOME done. The nozzle goes down over the up camera. Run the check?

[menu __main pnp jobs]
name: Jobs
icon: print
panel: gcodes

[menu __main pnp continue]
name: Continue
icon: resume
method: printer.gcode.script
params: {"script":"PNP_CONTINUE"}

[menu __main pnp stop]
name: Stop job
icon: stop
method: printer.gcode.script
params: {"script":"PNP_STOP"}
confirm: Stop the job after the current part?

[menu __main pnp lights]
name: Lights
icon: custom-script

[menu __main pnp lights up_on]
name: Up light on
icon: custom-script
method: printer.gcode.script
params: {"script":"UP_LIGHT_ON"}

[menu __main pnp lights up_off]
name: Up light off
icon: custom-script
method: printer.gcode.script
params: {"script":"UP_LIGHT_OFF"}

[menu __main pnp lights down_on]
name: Down light on
icon: custom-script
method: printer.gcode.script
params: {"script":"VISION_LIGHT_ON"}

[menu __main pnp lights down_off]
name: Down light off
icon: custom-script
method: printer.gcode.script
params: {"script":"VISION_LIGHT_OFF"}

[menu __main pnp bin]
name: Reject bin
icon: custom-script

[menu __main pnp bin goto]
name: Go to bin
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_BIN_GOTO"}

[menu __main pnp bin teach]
name: Teach bin here
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_BIN_TEACH"}
confirm: Save the nozzle's current position as the reject bin?

[menu __main pnp bin default]
name: Default bin
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_BIN_DEFAULT"}
confirm: Forget the taught bin and use the plate-layout default?

[menu __main pnp screen_test]
name: Screen test
icon: custom-script
method: printer.gcode.script
params: {"script":"PNP_SCREEN_TEST"}

[menu __main pnp launchers]
name: Update launchers
icon: refresh
method: printer.gcode.script
params: {"script":"PNP_LAUNCHERS NO_FEEDERS=1"}
